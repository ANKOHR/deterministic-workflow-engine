[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-workflow-engine"
version = "0.1.0"
description = "Local deterministic event orchestration and replay"
requires-python = ">=3.10"

[project.scripts]
dwe = "deterministic_workflow_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
